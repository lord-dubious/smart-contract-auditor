[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-auditor"
version = "0.1.0"
description = "AI-powered smart contract auditor using Slither, Foundry, and Gemini"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lord-dubious" }
]
keywords = [
    "smart-contracts",
    "security",
    "audit",
    "ethereum",
    "solidity",
    "slither",
    "foundry",
    "ai",
    "gemini"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "google-generativeai>=0.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
contract-auditor = "contract_auditor.cli:app"

[project.urls]
Homepage = "https://github.com/lord-dubious/smart-contract-auditor"
Repository = "https://github.com/lord-dubious/smart-contract-auditor"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
